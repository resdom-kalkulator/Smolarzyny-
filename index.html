<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projekt Smolarzyny</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smolarzyny">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="ikona-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script src="config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#F4F4F1;color:#141516;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.pad{padding-left:20px;padding-right:20px}
.top{padding-top:calc(16px + env(safe-area-inset-top))}
.lbl{font-size:13px;font-weight:600;color:#5E625D;letter-spacing:.02em}
.sec-title{margin:0;font-size:18px;font-weight:600}
.muted{color:#5E625D}
.card{background:#fff;border-radius:18px;border:1px solid #E4E5E1}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.kv .k{color:#5E625D}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;color:#4F6B54}
h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.02em}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#EEEFEB;color:#3F433F;font-size:12px;font-weight:500;white-space:nowrap}
.badge.demo{background:#FFF1D6;color:#6B4A00}
.hero{height:170px;max-height:320px;border-radius:20px;overflow:hidden;background:#DADBD6}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 60%}
.dark{background:#24272A;color:#fff;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.dark .s1{font-size:13px;font-weight:500;color:#C9CCC7}
.dark .big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.dark .s2{font-size:13px;color:#AEB9AF}
.dark .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:14px;border-top:1px solid #3A3E42}
.dark .grid span{display:block}
.dark .grid .a{font-size:12px;color:#C9CCC7;margin-bottom:4px}
.dark .grid .b{font-size:16px;font-weight:600}
.tile{display:flex;flex-direction:column;gap:12px;width:100%;padding:18px;background:#fff;border:1px solid #E4E5E1;border-radius:18px;text-align:left;font-size:15px}
.tile:active{background:#F8F8F6}
.tiles{display:grid;gap:12px}
.q4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qt{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px;background:#fff;border:1px solid #E4E5E1;border-radius:18px;text-align:left;font-size:13px}
.qt:active{background:#F8F8F6}
.qt .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px;font-weight:700}
.qt .n{font-size:12px;color:#5E625D;line-height:1.35}
.qt .lab{font-size:12px;color:#5E625D;margin-top:4px}
.qt .sum{font-size:18px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.qt .ln{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:#5E625D;flex-wrap:wrap}
.qt .ln b{font-weight:600;color:#141516}
.qt.all{background:#24272A;border-color:#24272A;color:#fff}
.qt.all .n,.qt.all .lab,.qt.all .ln{color:#C9CCC7}
.qt.all .ln b{color:#fff}
@media (min-width:600px){.hero{height:auto;aspect-ratio:2.4/1}}
@media (min-width:900px){.wrap{max-width:960px}.q4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid #D5D7D3;background:#fff;color:#2E3135;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:#2E3135;border-color:#2E3135;color:#fff}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.hscroll::-webkit-scrollbar{display:none}
.input{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1.5px solid #D5D7D3;background:#fff;font-size:16px;color:#141516;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:#4F6B54}
input[type=date].input{min-width:0;display:block}
textarea.input{height:88px;padding:12px 14px;resize:vertical;line-height:1.4}
.cat{min-height:52px;padding:10px 14px;border-radius:14px;border:1.5px solid #D5D7D3;background:#fff;color:#2E3135;font-size:15px;font-weight:500;text-align:left}
.cat.on{border-color:#4F6B54;background:#EDF2EC;color:#2C4230;font-weight:600}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;min-height:84px;border-radius:14px;border:1.5px solid #D5D7D3;background:#fff;color:#2E3135;text-align:left;min-width:0}
.pbtn.on{border-color:#4F6B54;background:#EDF2EC;color:#2C4230}
.pbtn .t{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.pbtn .s{font-size:13px;color:#5E625D}
.pbtn.on .s{color:#2C4230;font-weight:600}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid #B4B8B2;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff}
.pbtn.on .check{background:#4F6B54;border-color:#4F6B54}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;background:#E7E8E4;border-radius:14px;gap:4px}
.seg button{height:44px;border:0;border-radius:11px;background:transparent;color:#2E3135;font-size:15px;font-weight:500}
.seg button.on{background:#fff;color:#141516;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border:0;border-radius:16px;background:#4F6B54;color:#fff;font-size:17px;font-weight:600}
.primary:active{background:#435C48}
.primary[disabled]{opacity:.6}
.ghost{height:44px;padding:0 14px;border-radius:12px;border:1px solid #D5D7D3;background:#fff;color:#2E3135;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.linkbtn{height:44px;padding:0 4px;border:0;background:transparent;color:#3E5843;font-size:14px;font-weight:600}
.danger{width:100%;height:52px;border-radius:14px;border:1.5px solid #E2C3BD;background:#fff;color:#A33A2B;font-size:16px;font-weight:600}
.danger.on{background:#A33A2B;border-color:#A33A2B;color:#fff}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid #E4E5E1;background:#fff;display:flex;align-items:center;justify-content:center;color:#141516}
.list{overflow:hidden;display:flex;flex-direction:column;gap:1px;background:#EEEFEB}
.row{display:flex;justify-content:space-between;gap:12px;flex:1;min-width:0;padding:14px 6px 14px 16px;border:0;background:#fff;text-align:left}
.row:active{background:#F8F8F6}
.trash{flex:none;width:52px;border:0;background:#fff;color:#6B6F6A;display:flex;align-items:center;justify-content:center}
.trash:active{background:#FBF3F1;color:#A33A2B}
.ok{color:#3E5843}
.bad{color:#A33A2B}
.photo{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:14px;border:1.5px dashed #B4B8B2;background:#fff;color:#2E3135;font-size:15px;font-weight:500;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.bar{height:6px;border-radius:3px;background:#EEEFEB;overflow:hidden}
.bar i{display:block;height:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(244,244,241,.96);border-top:1px solid #E4E5E1;padding:12px 20px calc(14px + env(safe-area-inset-bottom))}
.bottom .in{max-width:600px;margin:0 auto}
.sheet{position:fixed;inset:0;z-index:20;background:#F4F4F1;display:flex;flex-direction:column}
.sheet .hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid #E4E5E1}
.sheet .hd h2{margin:0;font-size:21px;font-weight:700}
.sheet .bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bd .in{max-width:600px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:22px}
.sheet .ft{flex:none;border-top:1px solid #E4E5E1;padding:12px 20px calc(14px + env(safe-area-inset-bottom))}
.sheet .ft .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.dim{position:fixed;inset:0;z-index:30;background:rgba(20,21,22,.45);display:flex;align-items:flex-end;justify-content:center}
.pop{width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow-y:auto}
@media (min-width:700px){.dim{align-items:center}.pop{border-radius:22px}}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 12px;border:0;border-radius:14px;background:#fff;text-align:left;font-size:16px;font-weight:500}
.mi:active{background:#F4F4F1}
.mi svg{flex:none;color:#4F6B54}
.mi small{display:block;font-size:13px;font-weight:400;color:#5E625D;margin-top:2px}
.warn{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:#FFF6E5;border:1px solid #F1DDB0;color:#5C3F00;font-size:14px;line-height:1.4}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.center .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.logo{width:72px;height:72px;border-radius:18px;display:block}
#toast{position:fixed;left:20px;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:50;max-width:560px;margin:0 auto;padding:14px 16px;border-radius:14px;background:#24272A;color:#fff;font-size:15px;font-weight:500;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #D5D7D3;border-top-color:#4F6B54;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.viewer img{display:block;max-width:100%;height:auto;border-radius:12px;background:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<noscript><p style="padding:20px">Ta aplikacja wymaga włączonej obsługi JavaScript.</p></noscript>
<div id="main"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= Ustawienia i pomocnicze ================= */
var CFG = window.SMOLARZYNY_CONFIG || {};
var DEMO = !CFG.supabaseUrl || !CFG.supabaseKey;
var CODE_KEY = 'smolarzyny_kod';
var VERSION = '1.0';

var LS = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};

var CATS = [
  { id: 'usluga', label: 'Usługa', short: 'Usługa' },
  { id: 'material', label: 'Materiał lub przedmiot', short: 'Materiał' },
  { id: 'robocizna', label: 'Robocizna', short: 'Robocizna' },
  { id: 'oplata', label: 'Opłata urzędowa', short: 'Opłata urzędowa' },
  { id: 'inne', label: 'Inne', short: 'Inne' }
];
// Działki – stała kolejność i numery ewidencyjne. Kwoty w groszach, BRUTTO = netto + VAT.
var PLOTS0 = [
  { id: 'd1', name: 'Działka 1', nr: '8121/5', area: 888,  net: 11100000, vat: 2553000, price: 13653000, date: '2026-11-16' },
  { id: 'd2', name: 'Działka 2', nr: '8121/4', area: 1016, net: 12700000, vat: 2921000, price: 15621000, date: '2026-11-16' },
  { id: 'd3', name: 'Działka 3', nr: '8121/3', area: 908,  net: 11350000, vat: 2610500, price: 13960500, date: '2026-11-16' }
];
// Nazwa i numer ewidencyjny są zawsze takie jak wyżej (nie da się ich zmienić w aplikacji).
function fixPlots(list) {
  return PLOTS0.map(function (b) {
    var x = (list || []).filter(function (p) { return p.id === b.id; })[0] || b;
    return Object.assign({}, b, { area: x.area != null ? +x.area : b.area, net: x.net != null ? +x.net : null, vat: x.vat != null ? +x.vat : null, price: x.price != null ? +x.price : null, date: x.date || b.date });
  });
}
function area(m2) { return m2 ? new Intl.NumberFormat('pl-PL').format(m2) + ' m²' : '—'; }
function catLabel(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].label; return 'Inne'; }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var NF = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmt(g) { return NF.format((g || 0) / 100); }
// "1 500,50" / "1500.5" / "1.500,50" -> grosze (liczba całkowita). Zły zapis -> NaN.
function parseMoney(s) {
  if (s == null) return NaN;
  var t = String(s).replace(/[\s zł]/gi, '');
  if (t.indexOf(',') >= 0 && t.indexOf('.') >= 0) t = t.replace(/\./g, '');
  t = t.replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * 100);
}
// "16.11.2026", "16.11.26", "16112026", "2026-11-16" -> "2026-11-16"; błędna data -> ''
function plToIso(str) {
  var t = String(str || '').trim(), m;
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/))) m = [0, m[3], m[2], m[1]];
  else if ((m = t.match(/^(\d{2})(\d{2})(\d{4})$/))) {}
  else m = t.match(/^(\d{1,2})[.\/\-, ]+(\d{1,2})[.\/\-, ]+(\d{2}|\d{4})$/);
  if (!m) return '';
  var d = +m[1], mo = +m[2], y = +m[3]; if (y < 100) y += 2000;
  var dt = new Date(Date.UTC(y, mo - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d || y < 2000 || y > 2100) return '';
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function toStr(g) { return (g / 100).toFixed(2).replace('.', ','); }
function dLabel(iso) { var p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso; }
function today() { var d = new Date(); var z = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function plural(n, one, few, many) {
  var m10 = n % 10, m100 = n % 100;
  if (n === 1) return n + ' ' + one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return n + ' ' + few;
  return n + ' ' + many;
}
function nWyd(n) { return plural(n, 'wydatek', 'wydatki', 'wydatków'); }
function uid() { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2); }

// Podział kwoty (w groszach) na działki. Suma części ZAWSZE równa się kwocie wydatku.
function alloc(e) {
  var out = {}, ps = e.plots || [];
  if (!ps.length) return out;
  if (e.mode === 'manual' && ps.length > 1) { ps.forEach(function (p) { out[p] = (e.manual && +e.manual[p]) || 0; }); return out; }
  var base = Math.floor(e.amount / ps.length), rem = e.amount - base * ps.length;
  ps.forEach(function (p, i) { out[p] = base + (i < rem ? 1 : 0); });
  return out;
}

/* ================= Ikony ================= */
function svg(d, size, sw) { return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
var IC = {
  menu: '<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  close: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
  trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  clip: '<path d="M20 11.5l-8 8a5 5 0 01-7-7l8.5-8.5a3.3 3.3 0 014.7 4.7L9.7 17.2a1.7 1.7 0 01-2.4-2.4L15 7"/>',
  down: '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  up: '<path d="M12 20V9"/><path d="M7 14l5-5 5 5"/><path d="M5 4h14"/>',
  refresh: '<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 5v6h-6"/>',
  sheet: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16"/><path d="M4 15h16"/><path d="M10 3v18"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  checkm: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17v.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8v.5"/>'
};

/* ================= Przechowywanie danych ================= */
function ApiError(kind, message) { this.kind = kind; this.message = message; }

// Tryb pokazowy: dane tylko w tej przeglądarce.
var DEMO_KEY = 'smolarzyny_pokaz_v2';
var LocalAPI = {
  mem: {},
  seed: function () { return { plots: fixPlots(PLOTS0), expenses: [] }; },
  db: function () {
    var d = null; try { d = JSON.parse(LS.get(DEMO_KEY)); } catch (e) {}
    if (!d || !d.plots) { d = this.seed(); this.put(d); }
    return d;
  },
  put: function (d) { LS.set(DEMO_KEY, JSON.stringify(d)); },
  check: function () { return Promise.resolve(true); },
  load: function () { var d = this.db(); return Promise.resolve({ plots: d.plots, expenses: d.expenses }); },
  savePlot: function (p) { var d = this.db(); d.plots = d.plots.map(function (x) { return x.id === p.id ? Object.assign({}, x, p) : x; }); this.put(d); return Promise.resolve(true); },
  saveExpense: function (e) {
    var d = this.db(), self = this;
    if (e.docId && this.mem[e.docId]) e.docName = this.mem[e.docId].name;
    if (!e.docId) e.docName = null;
    if (!e.id) { e = Object.assign({}, e, { id: uid(), created: new Date().toISOString() }); d.expenses.push(e); }
    else d.expenses = d.expenses.map(function (x) {
      if (x.id !== e.id) return x;
      if (x.docId && x.docId !== e.docId) delete self.mem[x.docId];
      return Object.assign({}, x, e);
    });
    this.put(d); return Promise.resolve({ id: e.id });
  },
  deleteExpense: function (id) { var d = this.db(); d.expenses = d.expenses.filter(function (x) { return x.id !== id; }); this.put(d); return Promise.resolve(true); },
  saveDoc: function (doc) { var id = uid(); this.mem[id] = doc; return Promise.resolve(id); },
  getDoc: function (id) { var d = this.mem[id]; return d ? Promise.resolve(d) : Promise.reject(new ApiError('demo', 'W trybie pokazowym zdjęcia są pamiętane tylko do odświeżenia strony. Po podłączeniu bazy będą zapisywane na stałe.')); },
  restore: function (data) { var d = this.db(); d.plots = fixPlots(data.plots); d.expenses = data.expenses.map(function (e) { return Object.assign({}, e, { id: uid() }); }); this.put(d); return Promise.resolve(true); },
  reset: function () { LS.del(DEMO_KEY); this.mem = {}; return Promise.resolve(true); }
};

// Tryb właściwy: baza Supabase. Każde zapytanie wymaga kodu dostępu.
var RemoteAPI = {
  code: function () { return LS.get(CODE_KEY) || ''; },
  rpc: function (fn, args) {
    var key = CFG.supabaseKey, h = { 'Content-Type': 'application/json', 'apikey': key };
    if (/^eyJ/.test(key)) h.Authorization = 'Bearer ' + key;
    return fetch(String(CFG.supabaseUrl).replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(args), cache: 'no-store' })
      .catch(function () { throw new ApiError('offline', 'Brak połączenia z bazą danych. Sprawdź internet. Jeśli internet działa, baza mogła zostać uśpiona po 7 dniach bez używania (patrz instrukcja).'); })
      .then(function (res) {
        return res.text().then(function (txt) {
          var body = null; try { body = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (res.ok) return body;
          var msg = (body && (body.message || body.msg || body.error)) || txt || '';
          if (/ZLY_KOD/.test(msg)) throw new ApiError('code', 'Nieprawidłowy kod dostępu.');
          if (res.status === 404 || /could not find the function|PGRST202/i.test(msg)) throw new ApiError('setup', 'Baza danych nie jest jeszcze przygotowana (brakuje skryptu setup.sql).');
          if (res.status === 401 || /api key|apikey|JWT/i.test(msg)) throw new ApiError('key', 'Nieprawidłowy klucz w pliku config.js.');
          if (res.status >= 500 && !body) throw new ApiError('offline', 'Baza danych nie odpowiada. Mogła zostać uśpiona po 7 dniach bez używania (patrz instrukcja).');
          throw new ApiError('server', msg || ('Błąd serwera (' + res.status + ').'));
        });
      });
  },
  check: function (code) { return this.rpc('sm_sprawdz', { p_kod: code }); },
  load: function () { return this.rpc('sm_pobierz', { p_kod: this.code() }); },
  savePlot: function (p) { return this.rpc('sm_zapisz_dzialke', { p_kod: this.code(), p_dzialka: p }); },
  saveExpense: function (e) { return this.rpc('sm_zapisz_wydatek', { p_kod: this.code(), p_wydatek: e }); },
  deleteExpense: function (id) { return this.rpc('sm_usun_wydatek', { p_kod: this.code(), p_id: id }); },
  saveDoc: function (doc) { return this.rpc('sm_zapisz_dokument', { p_kod: this.code(), p_nazwa: doc.name, p_typ: doc.type, p_dane: doc.data }); },
  getDoc: function (id) { return this.rpc('sm_pobierz_dokument', { p_kod: this.code(), p_id: id }); },
  restore: function (data) { return this.rpc('sm_przywroc', { p_kod: this.code(), p_dane: data }); }
};

function plotName(id) { for (var i = 0; i < S.plots.length; i++) if (S.plots[i].id === id) return S.plots[i].name; return id; }

/* ================= Obliczenia ================= */
function vm() {
  var withA = S.expenses.map(function (e) { return { e: e, a: alloc(e) }; });
  var plots = S.plots.map(function (p) {
    var mine = withA.filter(function (x) { return x.a[p.id] != null; });
    var other = mine.reduce(function (t, x) { return t + x.a[p.id]; }, 0);
    return Object.assign({}, p, { count: mine.length, other: other, total: (p.net || 0) + other });
  });
  var land = plots.reduce(function (t, p) { return t + (p.net || 0); }, 0);
  var otherAll = S.expenses.reduce(function (t, e) { return t + e.amount; }, 0);
  var anyPrice = S.plots.some(function (p) { return p.net != null; });
  var scope = S.screen === 'plot' ? S.plotId : null;
  var pool = scope ? withA.filter(function (x) { return x.a[scope] != null; }) : withA;
  var amtFor = function (x) { return scope ? (x.a[scope] || 0) : x.e.amount; };
  return { withA: withA, plots: plots, land: land, otherAll: otherAll, anyPrice: anyPrice, scope: scope, pool: pool, amtFor: amtFor };
}
function filtered(m) {
  var q = S.q.trim().toLowerCase();
  return m.pool.filter(function (x) {
    if (q && (x.e.name + ' ' + (x.e.notes || '')).toLowerCase().indexOf(q) < 0) return false;
    if (S.fcat !== 'all' && x.e.cat !== S.fcat) return false;
    if (S.from && x.e.date < S.from) return false;
    if (S.to && x.e.date > S.to) return false;
    return true;
  }).sort(function (A, B) { return B.e.date.localeCompare(A.e.date) || String(B.e.created || '').localeCompare(String(A.e.created || '')); });
}

function formCalc() {
  var F = S.form, amt = parseMoney(F.amount), amtOk = amt > 0;
  var sel = S.plots.filter(function (p) { return F.plots[p.id]; }).map(function (p) { return p.id; });
  var n = sel.length, manualOn = n > 1 && F.mode === 'manual', shares = {};
  if (amtOk && n) {
    if (manualOn) sel.forEach(function (id) { var r = F.manual[id]; var v = r === '' || r == null ? 0 : parseMoney(r); shares[id] = isNaN(v) ? null : v; });
    else shares = alloc({ amount: amt, plots: sel, mode: 'equal' });
  }
  return { amt: amt, amtOk: amtOk, sel: sel, n: n, manualOn: manualOn, shares: shares };
}

  }).join('');
  // opis podziału / status
  var st = document.getElementById('f-stat'), txt = '', cls = '';

      var sum = 0, bad = false;
      c.sel.forEach(function (id) { var r = F.manual[id]; var v = r === '' || r == null ? 0 : parseMoney(r); if (isNaN(v)) bad = true; else sum += v; });

  }
  st.className = cls; st.style.fontWeight = cls && cls !== 'muted' ? '600' : '400'; st.textContent = txt;
  document.getElementById('f-err').innerHTML = F.error ? '<div role="alert" class="bad" style="font-size:14px;font-weight:600;line-height:1.4">' + esc(F.error) + '</div>' : '';

/* ================= Działania ================= */
function closeOverlay() { S.overlay = null; S.form = null; S.plotForm = null; S.confirm = null; S.viewer = null; renderOverlay(); }

function refresh(first) {
  if (first) { S.phase = 'loading'; render(); }
  return API.load().then(function (d) {
    S.plots = fixPlots(d.plots); S.expenses = (d.expenses || []).map(function (e) { e.amount = +e.amount; e.manual = e.manual || {}; return e; });
    S.loadedAt = Date.now();
    if (!LS.get('smolarzyny_start')) LS.set('smolarzyny_start', String(Date.now()));
    var was = S.phase; S.phase = 'ready';
    if (was !== 'ready') render(); else { document.getElementById('main').innerHTML = mainView(); }
    return true;
  }).catch(function (err) {
    if (err.kind === 'code') { LS.del(CODE_KEY); S.phase = 'code'; S.codeError = 'Kod dostępu jest nieprawidłowy albo został zmieniony. Wpisz go ponownie.'; closeOverlay(); render(); }
    else if (S.phase !== 'ready') { S.phase = 'error'; S.errorMsg = err.message || String(err); render(); }
    else toast(err.message || 'Nie udało się odświeżyć danych.');
    return false;
  });
}

function saveExpense() {
  var F = S.form; if (F.saving) return;
  var err = function (m) { F.error = m; updateForm(false); };
  var amount = parseMoney(F.amount);
  var plots = S.plots.filter(function (p) { return F.plots[p.id]; }).map(function (p) { return p.id; });
  F.date = plToIso(F.dateTxt);
  if (!F.date) return err('Wpisz datę w formacie dzień.miesiąc.rok, np. 16.11.2026.');
  if (!F.cat) return err('Wybierz rodzaj wydatku.');
  if (!F.name.trim()) return err('Wpisz nazwę wydatku.');
  if (!(amount > 0)) return err('Podaj poprawną kwotę, np. 1500 lub 1500,50.');
  if (!plots.length) return err('Zaznacz co najmniej jedną działkę.');
  var mode = plots.length > 1 ? F.mode : 'equal', manual = {};
  if (mode === 'manual') {
    var sum = 0;
    for (var i = 0; i < plots.length; i++) {
      var raw = F.manual[plots[i]], v = raw === '' || raw == null ? 0 : parseMoney(raw);
      if (isNaN(v)) return err('Popraw kwotę dla: ' + plotName(plots[i]) + '.');
      manual[plots[i]] = v; sum += v;
    }
    if (sum !== amount) return err('Suma podziału (' + fmt(sum) + ') musi być równa kwocie wydatku (' + fmt(amount) + ').');
  }
  F.saving = true; F.error = ''; updateForm(false);
  var editing = !!F.id;
  var docStep = F.file ? API.saveDoc(F.file) : Promise.resolve(F.docId);
  docStep.then(function (docId) {
    return API.saveExpense({ id: F.id, date: F.date, cat: F.cat, name: F.name.trim(), amount: amount, plots: plots, mode: mode, manual: manual, notes: F.notes.trim(), docId: docId || null });
  }).then(function () {
    closeOverlay();
    return refresh(false);
  }).then(function () {
    toast(editing ? 'Zapisano zmiany. Koszty działek przeliczone.' : (plots.length === 1 ? 'Zapisano. Cała kwota przypisana do: ' + plotName(plots[0]) + '.' : 'Zapisano. Kwota rozdzielona na ' + plots.length + ' działki.'));
  }).catch(function (e) {
    if (S.form) { S.form.saving = false; err(e.message || 'Nie udało się zapisać. Spróbuj jeszcze raz.'); }
    else toast(e.message || 'Nie udało się zapisać.');
  });
}

function deleteExpense(id) {
  S.pendingDel = null;
  API.deleteExpense(id).then(function () { closeOverlay(); return refresh(false); })
    .then(function () { toast('Usunięto wydatek. Koszty działek przeliczone.'); })
    .catch(function (e) { toast(e.message || 'Nie udało się usunąć.'); });
}

function savePlot() {
  var P = S.plotForm; if (P.saving) return;
  var net = parseMoney(P.net), vat = Math.round(net * 0.23), ar = String(P.area).replace(/\s/g, '');
  if (isNaN(net)) { P.error = 'Podaj poprawną cenę netto, np. 111000 lub 111 000,00.'; renderOverlay(); return; }
  if (!/^\d{1,7}$/.test(ar)) { P.error = 'Podaj powierzchnię w pełnych metrach, np. 888.'; renderOverlay(); return; }
  var old = S.plots.filter(function (x) { return x.id === P.id; })[0], form = P;
  S.overlay = 'confirm';
  S.confirm = { title: 'Zmienić cenę zakupu?', text: P.name + ' (nr ' + P.nr + '): cena netto zmieni się z ' + (old.net == null ? '—' : fmt(old.net)) + ' na ' + fmt(net) + '. Wszystkie podsumowania zostaną przeliczone.', ok: 'Tak, zmień',
    cancel: function () { S.overlay = 'plot'; S.plotForm = form; S.confirm = null; renderOverlay(); },
    run: function () {
      S.confirm = null; S.overlay = 'plot'; S.plotForm = form; form.saving = true; form.error = ''; renderOverlay();
      API.savePlot({ id: form.id, area: +ar, net: net, vat: vat, price: net + vat })
        .then(function () { closeOverlay(); return refresh(false); })
        .then(function () { toast('Zapisano nową cenę zakupu. Podsumowania przeliczone.'); })
        .catch(function (e) { if (S.plotForm) { S.plotForm.saving = false; S.plotForm.error = e.message; renderOverlay(); } });
    } };
  renderOverlay();
}

function readFileB64(file) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = function () { rej(new Error('Nie udało się odczytać pliku.')); }; r.readAsDataURL(file); });
}
function prepareFile(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    if (file.size > 3 * 1024 * 1024) return Promise.reject(new Error('Plik PDF jest za duży (maks. 3 MB). Zrób zdjęcie dokumentu zamiast PDF.'));
    return readFileB64(file).then(function (d) { return { name: file.name, type: 'application/pdf', data: d }; });
  }
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ name: (file.name || 'zdjecie').replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.72).split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Nie udało się odczytać zdjęcia. Spróbuj innego pliku.')); };
    img.src = url;
  });
}

function b64ToBytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

// Zapis pliku: na telefonie okno „Udostępnij”, na komputerze zwykłe pobranie.
function deliverFile(name, mime, data) {
  var blob = new Blob([data], { type: mime });
  var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  try {
    var file = new File([blob], name, { type: mime });
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: name }).then(function () { return true; }, function (e) { return e && e.name === 'AbortError' ? false : download(); });
    }
  } catch (e) {}
  return Promise.resolve(download());
  function download() {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.overlay && S.overlay !== 'confirm') closeOverlay(); });
// Po powrocie do aplikacji pobierz najnowsze dane (np. wpisy drugiej osoby).
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.phase === 'ready' && !S.overlay && Date.now() - S.loadedAt > 30000) refresh(false);
});

/* ================= Start ================= */
(function start() {
  var m = location.hash.match(/kod=([^&]+)/);
  if (m && !DEMO) { LS.set(CODE_KEY, decodeURIComponent(m[1])); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  if (!DEMO && !RemoteAPI.code()) { S.phase = 'code'; render(); return; }
  refresh(true);
})();
</script>
